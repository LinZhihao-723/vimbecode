# The word-motion grid: `w`, `e`, `b`, `W`, `E`, and `B` crossed with the text shapes whose word
# boundaries are easiest to get wrong. Buffers are shared within a scenario so that the six
# motions can be compared against each other.

[[case]]
id = "word-w-cjk-latin"
description = "`w` three times across CJK and Latin mixed without spaces."
buffer = "中文abc 英文def 结束done\n"
keys = "0www"
viewport_width = 80
tags = ["word-motion", "cjk"]

[[case]]
id = "word-e-cjk-latin"
description = "`e` three times across CJK and Latin mixed without spaces."
buffer = "中文abc 英文def 结束done\n"
keys = "0eee"
viewport_width = 80
tags = ["word-motion", "cjk"]

[[case]]
id = "word-b-cjk-latin"
description = "`b` three times from the line end across CJK and Latin mixed without spaces."
buffer = "中文abc 英文def 结束done\n"
keys = "$bbb"
viewport_width = 80
tags = ["word-motion", "cjk"]

[[case]]
id = "word-big-w-cjk-latin"
description = "`W` twice across CJK and Latin mixed without spaces."
