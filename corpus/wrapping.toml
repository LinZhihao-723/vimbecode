# Several viewport widths crossed with 'breakindent' and 'showbreak', plus the 'nowrap' variants
# where the viewport scrolls horizontally instead. The decorated variants are laid out at
# twenty-four columns: vim keeps at least twenty cells of text next to a repeated indent, so
# 'breakindent' has no effect at all in a twenty-column viewport.

[[case]]
id = "wrap-w20-plain"
description = "An indented long line wrapped at twenty columns with no continuation decoration."
buffer = """
    the indented sentence that wraps a few times before it finally ends here
"""
keys = "gjgj"
viewport_width = 20
tags = ["wrap"]

[[case]]
id = "wrap-w20-boundary-exact"
description = "A line whose wrap boundary falls exactly on the twentieth cell of the viewport."
buffer = """
abcdefghijklmnopqrstuvwxyz0123456789
"""
keys = "gj"
viewport_width = 20
viewport_height = 10
tags = ["ascii", "wrap"]

[[case]]
id = "wrap-w24-plain"
description = "The same line at twenty-four columns with no continuation decoration."
buffer = """
    the indented sentence that wraps a few times before it finally ends here
"""
keys = "gjgj"
viewport_width = 24
tags = ["wrap"]

[[case]]
id = "wrap-w24-breakindent"
description = "The same line at twenty-four columns with continuation lines carrying the indent."
buffer = """
    the indented sentence that wraps a few times before it finally ends here
"""
keys = "gjgj"
viewport_width = 24
tags = ["wrap", "breakindent"]
options = { breakindent = true }

[[case]]
id = "wrap-w24-showbreak"
description = "The same line at twenty-four columns with a continuation marker."
buffer = """
    the indented sentence that wraps a few times before it finally ends here
"""
keys = "gjgj"
viewport_width = 24
tags = ["wrap", "showbreak"]
options = { showbreak = "> " }

[[case]]
id = "wrap-w24-breakindent-showbreak"
description = "The same line at twenty-four columns with both the indent and the marker."
buffer = """
    the indented sentence that wraps a few times before it finally ends here
"""
keys = "gjgj"
viewport_width = 24
tags = ["wrap", "breakindent", "showbreak"]
options = { breakindent = true, showbreak = "> " }

[[case]]
id = "wrap-w40-plain"
description = "The same line at forty columns with no continuation decoration."
buffer = """
    the indented sentence that wraps a few times before it finally ends here
"""
keys = "gjg$"
viewport_width = 40
tags = ["wrap"]

[[case]]
id = "wrap-w40-breakindent-showbreak"
description = "The same line at forty columns with both the indent and the continuation marker."
buffer = """
    the indented sentence that wraps a few times before it finally ends here
"""
keys = "gjg$"
viewport_width = 40
tags = ["wrap", "breakindent", "showbreak"]
options = { breakindent = true, showbreak = "+++ " }

[[case]]
id = "wrap-w80-plain"
description = "A paragraph at eighty columns, where only the longest line wraps."
buffer = """
    the indented sentence that wraps a few times before it finally ends here and keeps running well past the eightieth column
short second line
"""
keys = "40|gj"
viewport_width = 80
tags = ["wrap"]

[[case]]
id = "wrap-w80-showbreak"
description = "The same paragraph at eighty columns, whose marker shifts the wrapped text right."
buffer = """
    the indented sentence that wraps a few times before it finally ends here and keeps running well past the eightieth column
short second line
"""
keys = "40|gj"
viewport_width = 80
tags = ["wrap", "showbreak"]
options = { showbreak = "\u21B3 " }

[[case]]
id = "nowrap-w40-horizontal-scroll"
description = "A long line with 'wrap' off, ending at the left edge of the scrolled viewport."
buffer = """
    the indented sentence that runs far past the right edge of the viewport and keeps going
"""
keys = "$g0"
viewport_width = 40
tags = ["nowrap"]
options = { wrap = false }

[[case]]
id = "nowrap-w20-cjk"
description = "A double-width line with 'wrap' off, scrolled to a column inside a wide character."
buffer = """
这是一行很长的中文文本用来测试不换行时的水平滚动
"""
keys = "$hh"
viewport_width = 20
tags = ["nowrap", "cjk"]
options = { wrap = false }
