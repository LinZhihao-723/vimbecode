[package]
name = "vbc-editor"
description = "The vimbecode editor built on top of the text layout engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "vimbecode"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
editor-types = { version = "0.0.2", default-features = false }
modalkit = { version = "0.0.25", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm_0_29",
    "std",
] }
vbc-layout = { path = "../vbc-layout" }

[dev-dependencies]
anyhow = "1.0.104"
proptest = "1.11.0"
serde_json = "1.0.151"
vbc-oracle = { path = "../vbc-oracle" }
