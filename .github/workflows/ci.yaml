name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "clippy, rustfmt"

      - uses: "Swatinem/rust-cache@v2"

      - name: "Check formatting"
        run: "cargo fmt --all --check"

      - name: "Run clippy"
        run: "cargo clippy --all-targets --all-features -- -D warnings"

  test:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"

      - name: "Install vim, which the differential oracle runs against"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes vim

      - name: "Build the workspace"
        run: "cargo build --all"

      - name: "Run the tests"
        run: "cargo test --all"

      # The layout soak is minutes of search rather than seconds, so it is the one test the run
      # above skips and this is where it is paid for: on every pull request, once. `layout_fuzz.rs`
      # reads this workflow and requires this job to run the command below unconditionally, down to
      # the test's own name and these flags, so the soak cannot be dropped without a test going red.
      - name: "Run the layout soak, which the default test run skips"
        run: |
          cargo test -p vbc-layout --test layout_fuzz -- \
            --include-ignored --exact the_reference_layout_survives_a_hundred_thousand_cases

      # The baseline records the state vim ends every corpus case in, and only the vim installed
      # above is an authority for those states, so this is where they are checked strictly.
      - name: "Check the corpus baseline"
        run: |
          vim --version | head -1
          cargo run --quiet --bin differential-run -- --check-baseline --strict-vim-version

      - name: "Check that the build leaves no untracked files"
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::The build produced untracked or modified files."
            exit 1
          fi

  # The vim installed on this runner is the version the baseline is recorded from, so a baseline
  # is recorded here and committed from the artifact this job uploads, never from a developer's own
  # vim.
  record-baseline:
    if: "github.event_name == 'workflow_dispatch'"
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"

      - name: "Install vim, which the differential oracle runs against"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes vim

      - name: "Record the corpus baseline"
        run: |
          vim --version | head -1
          cargo run --quiet --bin differential-run -- --record-baseline

      - uses: "actions/upload-artifact@v4"
        with:
          name: "corpus-baseline"
          path: "corpus/baseline.json"
