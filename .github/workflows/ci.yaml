name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "clippy, rustfmt"

      - uses: "Swatinem/rust-cache@v2"

      - name: "Check formatting"
        run: "cargo fmt --all --check"

      - name: "Run clippy"
        run: "cargo clippy --all-targets --all-features -- -D warnings"

  test:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"

      - name: "Install vim, which the differential oracle runs against"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes vim

      - name: "Build the workspace"
        run: "cargo build --all"

      - name: "Run the tests"
        run: "cargo test --all"

      - name: "Check that the build leaves no untracked files"
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::The build produced untracked or modified files."
            exit 1
          fi
