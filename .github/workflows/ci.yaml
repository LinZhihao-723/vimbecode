name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "clippy, rustfmt"

      - uses: "Swatinem/rust-cache@v2"

      - name: "Check formatting"
        run: "cargo fmt --all --check"

      - name: "Run clippy"
        run: "cargo clippy --all-targets --all-features -- -D warnings"

  test:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"

      - name: "Install vim, which the differential oracle runs against"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes vim

      # The runner is pinned rather than taken from `latest`, so the suite is run the same way on
      # every commit and a new runner arrives as a change to this file that can be reverted.
      - name: "Install the test runner"
        run: |
          curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
            https://get.nexte.st/0.9.143/linux \
            | tar zxf - -C "$HOME/.cargo/bin"
          cargo nextest --version

      - name: "Build the workspace"
        run: "cargo build --all"

      - name: "Run the tests"
        run: "cargo nextest run --workspace --profile ci"

      # The runner above runs no doctest, so the doctests are run by cargo's own harness here or
      # they are run nowhere at all. `layout_fuzz.rs` reads this workflow and requires this command
      # the way it requires the soaks' below.
      - name: "Run the doctests, which the test runner does not run"
        run: "cargo test --workspace --doc"

      # The layout soaks are minutes of search rather than seconds, so they are the tests the run
      # above skips and this is where they are paid for: on every pull request, once.
      # `layout_fuzz.rs` reads this workflow and requires this job to run both commands below
      # unconditionally, down to each test's own name and these flags, so neither soak can be
      # dropped without a test going red.
      - name: "Run the layout soak, which the default test run skips"
        run: |
          cargo nextest run -p vbc-layout --test layout_fuzz --run-ignored all --no-tests fail \
            -E 'test(=the_reference_layout_survives_a_million_cases)'

      - name: "Run the memory soak, which the default test run skips"
        run: |
          cargo nextest run -p vbc-layout --test layout_soak_memory --run-ignored all \
            --no-tests fail -E 'test(=the_long_run_leaves_the_heap_where_it_found_it)'

      # The baseline records the state vim ends every corpus case in, and only the vim installed
      # above is an authority for those states, so this is where they are checked strictly.
      - name: "Check the corpus baseline"
        run: |
          vim --version | head -1
          cargo run --quiet --bin differential-run -- --check-baseline --strict-vim-version

      - name: "Check that the build leaves no untracked files"
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::The build produced untracked or modified files."
            exit 1
          fi

  # The vim installed on this runner is the version the baseline is recorded from, so a baseline
  # is recorded here and committed from the artifact this job uploads, never from a developer's own
  # vim.
  record-baseline:
    if: "github.event_name == 'workflow_dispatch'"
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"

      - name: "Install vim, which the differential oracle runs against"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes vim

      - name: "Record the corpus baseline"
        run: |
          vim --version | head -1
          cargo run --quiet --bin differential-run -- --record-baseline

      - uses: "actions/upload-artifact@v4"
        with:
          name: "corpus-baseline"
          path: "corpus/baseline.json"
