name: ai-attribution

on:
  pull_request:
    types: ["edited", "opened", "reopened", "synchronize"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-attribution:
    runs-on: "ubuntu-24.04"
    steps:
      # The whole history, because the check reads every commit of the pull request rather than its
      # tip: a squash carries the trailers of every commit it folds forward into the one that lands.
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"

      # The title and the body are prose somebody typed, so each is written to a file and read from
      # one rather than passed through a shell. The title is read because a squash writes it as the
      # subject of the commit that lands.
      - name: "Write the pull request title and body where the linter can read them"
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
          PR_BODY: "${{ github.event.pull_request.body }}"
        run: |
          printf "%s" "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf "%s" "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"

      - name: "Check every commit of the pull request, its title and its body, for AI credit"
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          cargo run --quiet --package vbc-ci --bin ai-attribution-lint -- \
            --range "$BASE_SHA..$HEAD_SHA" \
            --title-file "$RUNNER_TEMP/pr-title.txt" \
            --body-file "$RUNNER_TEMP/pr-body.txt"
