name: ai-attribution

on:
  pull_request:
    types: ["edited", "opened", "reopened", "synchronize"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-attribution:
    runs-on: "ubuntu-24.04"
    steps:
      # The whole history, because the check reads every commit of the pull request rather than its
      # tip: a squash carries the trailers of every commit it folds forward into the one that lands.
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"

      # The body is prose somebody typed, so it is written to a file and read from one rather than
      # passed through a shell.
      - name: "Write the pull request body where the linter can read it"
        env:
          PR_BODY: "${{ github.event.pull_request.body }}"
        run: 'printf "%s" "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"'

      - name: "Check every commit of the pull request, and its body, for AI authorship credit"
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          cargo run --quiet --package vbc-ci --bin ai-attribution-lint -- \
            --range "$BASE_SHA..$HEAD_SHA" \
            --body-file "$RUNNER_TEMP/pr-body.txt"
